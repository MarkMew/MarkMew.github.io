name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Publish well-known resources
        run: cp -R .well-known "_site${{ steps.pages.outputs.base_path }}/.well-known"

      - name: Publish robots.txt
        run: cp robots.txt "_site${{ steps.pages.outputs.base_path }}/robots.txt"

      - name: Publish IndexNow key
        run: cp 07c696f22d3b46a48f6cf8c0cffe8371.txt "_site${{ steps.pages.outputs.base_path }}/"

      - name: Validate XML Sitemap
        run: ruby tools/check_sitemap.rb "_site${{ steps.pages.outputs.base_path }}"

      - name: Validate multilingual SEO
        run: ruby tools/check_multilingual_seo.rb "_site${{ steps.pages.outputs.base_path }}"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"
          # required so .well-known (dotfiles) survive the artifact upload
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    # A failed ping must not mark the deployment as failed.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Submit changed posts to IndexNow
        run: ruby tools/indexnow.rb "${{ github.event.before }}" "${{ github.sha }}"
